name: Mobile foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - name: Check Android and iOS JavaScript bundles (not native builds)
        run: npx expo export --platform all
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
